.icon-btn { background: none; border: none; font-size: 20px; color: var(--text-dark); cursor: pointer; }

    let currentIndex = -1;
    let currentFontSize = 18;
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-toggle');
    const barFill = document.getElementById('bar-fill');
    const lyricsDisplay = document.getElementById('display-lyrics');

    function init() {
        const listContainer = document.getElementById('list-salmos');
        listContainer.innerHTML = playlist.map((s, idx) => `
            <div class="salmo-row" id="row-${idx}" onclick="selectTrack(${idx})">
                <div class="row-img">${idx + 1}</div>
                <div class="row-info">
                    <b>${s.name}</b>
                    <span>IEPP Los Olivos</span>
                </div>
                <div class="row-duration">${s.dur}</div>
            </div>
        `).join('');
    }

    window.changeFontSize = function(delta) {
        currentFontSize += delta;
        if(currentFontSize < 14) currentFontSize = 14;
        if(currentFontSize > 32) currentFontSize = 32;
        lyricsDisplay.style.fontSize = currentFontSize + 'px';
    };

    window.selectTrack = function(idx) {
        currentIndex = idx;
        const s = playlist[idx];
        audio.src = s.url;
        document.getElementById('active-salmo-title').innerText = s.name;
        lyricsDisplay.innerHTML = s.lyrics || "Cargando alabanza...";
        
        document.querySelectorAll('.salmo-row').forEach(el => el.classList.remove('active'));
        document.getElementById(`row-${idx}`).classList.add('active');
        
        audio.play();
        updateUI(true);
    };

    window.handlePlay = function() {
        if(currentIndex === -1) return selectTrack(0);
        if(audio.paused) { audio.play(); updateUI(true); } 
        else { audio.pause(); updateUI(false); }
    };

    window.changeSalmo = function(dir) {
        let n = currentIndex + dir;
        if(n < 0) n = playlist.length-1;
        if(n >= playlist.length) n = 0;
        selectTrack(n);
    };

    window.toggleMute = function() {
        audio.muted = !audio.muted;
        document.getElementById('vol-icon').className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    };

    function updateUI(playing) {
        playBtn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
    }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100;
        barFill.style.width = pct + "%";
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-time').innerText = formatTime(audio.duration || 0);
    };

    function formatTime(s) {
        let m = Math.floor(s/60); let sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('prog-bar-container').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    audio.onended = () => changeSalmo(1);
    init();
})();
</script>
