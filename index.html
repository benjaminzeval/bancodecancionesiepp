<!-- Fuentes e Iconos -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div id="salmos-widget-container">
    
    <!-- SECCIÓN SUPERIOR: REPRODUCIR AHORA -->
    <div class="main-player-card">
        <div class="player-flex">
            <div class="album-art">
                <img id="current-art" src="https://iepresbiterianaperu.com/assets/images/gallery15/0bfe34aa.jpg?v=b4765b49" alt="Salmos">
                <div class="overlay-playing"><i class="fa-solid fa-volume-high"></i></div>
            </div>

            <div class="player-details">
                <div class="track-info">
                    <h1 id="active-salmo-title">Selecciona un Salmo</h1>
                    <p class="sede-tag">IEPP Los Olivos</p>
                </div>

                <div class="progress-wrapper">
                    <span class="time-label" id="current-time">0:00</span>
                    <div class="bar-bg" id="prog-bar-container">
                        <div id="bar-fill"></div>
                    </div>
                    <span class="time-label" id="total-time">0:00</span>
                </div>

                <div class="playback-controls">
                    <div class="nav-btns">
                        <button class="icon-btn" onclick="changeSalmo(-1)"><i class="fa-solid fa-backward-step"></i></button>
                        <button id="play-toggle" class="play-trigger" onclick="handlePlay()">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button class="icon-btn" onclick="changeSalmo(1)"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                    
                    <div class="extra-controls">
                        <button class="icon-btn sm" onclick="toggleMute()"><i id="vol-icon" class="fa-solid fa-volume-high"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="streaming-links">
            <a href="#" class="stream-btn spotify"><i class="fa-brands fa-spotify"></i> Spotify</a>
            <a href="#" class="stream-btn apple"><i class="fa-brands fa-apple"></i> Apple Music</a>
            <a href="#" class="stream-btn youtube"><i class="fa-brands fa-youtube"></i> YouTube Music</a>
        </div>
    </div>

    <!-- SECCIÓN DE LETRAS (Con controles de tamaño) -->
    <div class="lyrics-container">
        <div class="lyrics-header">
            <span><i class="fa-solid fa-align-left"></i> Letra del Salmo</span>
            <div class="font-controls">
                <button onclick="changeFontSize(-2)" title="Reducir letra">A-</button>
                <button onclick="changeFontSize(2)" title="Aumentar letra">A+</button>
            </div>
        </div>
        <div class="lyrics-drawer" id="lyrics-section">
            <div id="display-lyrics" class="lyrics-text">
                <p class="hint">La letra aparecerá aquí al reproducir.</p>
            </div>
        </div>
    </div>

    <!-- SECCIÓN INFERIOR: LISTA VERTICAL (CORREGIDA) -->
    <div class="playlist-container">
        <div id="list-salmos" class="vertical-list">
            <!-- Items generados por JS -->
        </div>
    </div>

    <audio id="main-audio"></audio>
</div>

<style>
:root {
    --primary: #1B2A56;
    --accent: #B5967B;
    --bg-card: #ffffff;
    --text-dark: #2D3436;
    --text-light: #636E72;
    --border: #ececec;
}

#salmos-widget-container {
    max-width: 700px;
    margin: 20px auto;
    font-family: 'Inter', sans-serif;
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid var(--border);
}

.main-player-card { margin-bottom: 20px; }

.player-flex { display: flex; gap: 25px; align-items: center; }

.album-art {
    position: relative; width: 160px; height: 160px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1); flex-shrink: 0;
}
.album-art img { width: 100%; height: 100%; object-fit: cover; }

.player-details { flex-grow: 1; }
.track-info h1 {
    font-family: 'Playfair Display', serif;
    font-size: 24px; margin: 0; color: var(--primary);
}
.sede-tag { color: var(--text-light); font-size: 14px; margin-top: 4px; }

/* BARRA PROGRESO */
.progress-wrapper { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
.time-label { font-size: 11px; font-weight: 600; color: #999; width: 35px; }
.bar-bg { flex-grow: 1; height: 5px; background: #eee; border-radius: 4px; cursor: pointer; position: relative; }
#bar-fill { position: absolute; height: 100%; width: 0%; background: var(--primary); border-radius: 4px; }

/* CONTROLES */
.playback-controls { display: flex; justify-content: space-between; align-items: center; }
.nav-btns { display: flex; align-items: center; gap: 15px; }
.play-trigger {
    background: var(--primary); color: white; width: 48px; height: 48px; 
    border-radius: 50%; border: none; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
}
.play-trigger:hover { transform: scale(1.05); }
.icon-btn { background: none; border: none; font-size: 20px; color: var(--text-dark); cursor: pointer; }
.icon-btn.sm { font-size: 18px; color: #999; }

/* --- SECCIÓN DE LETRAS --- */
.lyrics-container {
    margin: 20px 0;
    border: 1px solid #f0f0f0;
    border-radius: 12px;
    overflow: hidden;
    background: #fafafa;
}
.lyrics-header {
    background: #f1f3f5; padding: 10px 15px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 700; color: var(--primary);
    border-bottom: 1px solid #eee;
}
.font-controls button {
    background: white; border: 1px solid #ddd; border-radius: 4px;
    padding: 2px 8px; cursor: pointer; font-size: 12px; margin-left: 4px;
}
.font-controls button:hover { background: var(--primary); color: white; }

.lyrics-drawer { padding: 20px; max-height: 200px; overflow-y: auto; text-align: center; }
.lyrics-text { 
    font-size: 18px; line-height: 1.6; color: #333; 
    white-space: pre-line; transition: font-size 0.2s;
}
.hint { color: #aaa; font-style: italic; }

/* --- LISTA VERTICAL --- */
.playlist-container { border-top: 1px solid var(--border); padding-top: 10px; }

.salmo-row {
    display: flex;         
    align-items: center;   
    padding: 12px 15px;
    border-bottom: 1px solid #f9f9f9;
    cursor: pointer;
    transition: 0.2s;
}
.salmo-row:hover { background: #f8faff; }
.salmo-row.active { background: #f0f4ff; border-left: 4px solid var(--primary); }

.row-img {
    width: 38px; height: 38px; border-radius: 8px;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; flex-shrink: 0; margin-right: 15px;
}

.row-info { 
    flex-grow: 1; 
}

.row-info b { display: block; font-size: 15px; color: var(--text-dark); margin-bottom: 2px; }
.row-info span { font-size: 12px; color: #999; }

.row-duration { 
    font-size: 13px; color: #aaa; 
    margin-left: 10px; font-weight: 500;
}

/* BOTONES STREAMING */
.streaming-links { display: flex; gap: 10px; margin-top: 15px; }
.stream-btn {
    flex: 1; text-decoration: none; padding: 10px; border-radius: 8px;
    background: #f1f3f5; color: #444; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}

@media (max-width: 600px) {
    .player-flex { flex-direction: column; text-align: center; }
    .album-art { width: 140px; height: 140px; }
    .streaming-links { flex-direction: column; }
}
</style>

<script>
(function() {
    const playlist = [
        {
            name: "Salmo 5:1-2",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/5108a6fd3fb09f06ed3ab50b8edd56657ae7e87b/canciones/Salmo%205%201-2.mp3",
            lyrics: "Escucha, escucha oh Jehová, mis palabras;\nconsidera mi gemir,\nestá atento a la voz de mi clamor.\n\nRey mío y Dios mío porque a ti oraré,\noh Jehová de mañana oirás mi voz.\nDe mañana me presentaré delante de ti\ny esperaré.",
            dur: "2:30"
        },
        {
            name: "Salmo 5:3",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/5108a6fd3fb09f06ed3ab50b8edd56657ae7e87b/canciones/Salmo%205%203.mp3",
            lyrics: "Oh Jehová, de mañana oirás mi voz.\nDe mañana me presentaré delante de ti,\ny esperaré.",
            dur: "1:45"
        },
        {
            name: "Salmo 16",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/ff3d7084dd8db04ed72401f871b059296471ead8/canciones/Salmo%2016.mp3",
            lyrics: "//Guárdame, oh Dios, porque en ti he confiado.\nOh alma mía, dijiste a Jehová:// x2 \n //Tú eres mi Señor;// x2 \nno hay para mí bien fuera de ti.\n //Tú eres mi Señor;// x2 \nno hay para mí bien fuera de ti.\n \nEn tu presencia hay plenitud de gozo\nDelicias a tu diestra para siempre\n//Me mostrarás la senda de la vida\nEn tu presencia hay plenitud de gozo//x2",
            dur: "3:12"
        }
    ];

    let currentIndex = -1;
    let currentFontSize = 18;
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-toggle');
    const barFill = document.getElementById('bar-fill');
    const lyricsDisplay = document.getElementById('display-lyrics');

    function init() {
        const listContainer = document.getElementById('list-salmos');
        listContainer.innerHTML = playlist.map((s, idx) => `
            <div class="salmo-row" id="row-${idx}" onclick="selectTrack(${idx})">
                <div class="row-img">${idx + 1}</div>
                <div class="row-info">
                    <b>${s.name}</b>
                    <span>IEPP Los Olivos</span>
                </div>
                <div class="row-duration">${s.dur}</div>
            </div>
        `).join('');
    }

    window.changeFontSize = function(delta) {
        currentFontSize += delta;
        if(currentFontSize < 14) currentFontSize = 14;
        if(currentFontSize > 32) currentFontSize = 32;
        lyricsDisplay.style.fontSize = currentFontSize + 'px';
    };

    window.selectTrack = function(idx) {
        currentIndex = idx;
        const s = playlist[idx];
        audio.src = s.url;
        document.getElementById('active-salmo-title').innerText = s.name;
        lyricsDisplay.innerHTML = s.lyrics || "Cargando alabanza...";
        
        document.querySelectorAll('.salmo-row').forEach(el => el.classList.remove('active'));
        document.getElementById(`row-${idx}`).classList.add('active');
        
        audio.play();
        updateUI(true);
    };

    window.handlePlay = function() {
        if(currentIndex === -1) return selectTrack(0);
        if(audio.paused) { audio.play(); updateUI(true); } 
        else { audio.pause(); updateUI(false); }
    };

    window.changeSalmo = function(dir) {
        let n = currentIndex + dir;
        if(n < 0) n = playlist.length-1;
        if(n >= playlist.length) n = 0;
        selectTrack(n);
    };

    window.toggleMute = function() {
        audio.muted = !audio.muted;
        document.getElementById('vol-icon').className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    };

    function updateUI(playing) {
        playBtn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
    }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100;
        barFill.style.width = pct + "%";
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-time').innerText = formatTime(audio.duration || 0);
    };

    function formatTime(s) {
        let m = Math.floor(s/60); let sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('prog-bar-container').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    audio.onended = () => changeSalmo(1);
    init();
})();
</script>
