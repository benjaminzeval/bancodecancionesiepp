<!-- Fuentes e Iconos -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div id="salmos-widget-container">
    
    <!-- SECCIÓN SUPERIOR: REPRODUCIR AHORA (Estilo Referencia) -->
    <div class="main-player-card">
        <div class="player-flex">
            <!-- Miniatura / Carátula -->
            <div class="album-art">
                <img id="current-art" src="https://images.unsplash.com/photo-1507838596056-a376cf498501?q=80&w=400&auto=format&fit=crop" alt="Salmos">
            </div>

            <!-- Información y Controles -->
            <div class="player-details">
                <div class="track-info">
                    <span class="eyebrow">IEPP LOS OLIVOS</span>
                    <h1 id="active-salmo-title">Seleccione un Salmo</h1>
                </div>

                <!-- Barra de Progreso -->
                <div class="progress-wrapper">
                    <span class="time-label" id="current-time">0:00</span>
                    <div class="bar-bg" id="prog-bar-container">
                        <div id="bar-fill"></div>
                    </div>
                    <span class="time-label" id="total-time">0:00</span>
                </div>

                <!-- Controles Horizontales -->
                <div class="playback-controls">
                    <div class="nav-btns">
                        <button class="icon-btn" onclick="changeSalmo(-1)"><i class="fa-solid fa-backward-step"></i></button>
                        <button id="play-toggle" class="play-trigger" onclick="handlePlay()">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button class="icon-btn" onclick="changeSalmo(1)"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                    
                    <div class="extra-controls">
                        <button class="icon-btn sm"><i class="fa-solid fa-shuffle"></i></button>
                        <button class="icon-btn sm" onclick="toggleMute()"><i id="vol-icon" class="fa-solid fa-volume-high"></i></button>
                        <button class="icon-btn sm"><i class="fa-solid fa-list-ul"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN INFERIOR: PLAYLIST Y LETRAS -->
    <div class="playlist-container">
        <!-- Letras Dinámicas -->
        <div class="lyrics-drawer" id="lyrics-section">
            <div id="display-lyrics" class="lyrics-text">
                <p class="hint">La letra del salmo se mostrará aquí durante la reproducción.</p>
            </div>
        </div>
        
        <!-- Lista de 24 Salmos -->
        <div id="list-salmos" class="vertical-list">
            <!-- Items generados por JavaScript -->
        </div>
    </div>

    <audio id="main-audio"></audio>
</div>

<style>
:root {
    --primary: #1B2A56;
    --accent: #B5967B;
    --bg-card: #ffffff;
    --text-dark: #2D3436;
    --text-light: #636E72;
    --border: #f0f0f0;
}

#salmos-widget-container {
    max-width: 650px;
    margin: 20px auto;
    font-family: 'Inter', sans-serif;
    background: #fff;
    padding: 25px;
    border-radius: 24px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.05);
}

/* CARD SUPERIOR */
.main-player-card {
    background: var(--bg-card);
    padding: 10px;
    margin-bottom: 20px;
}

.player-flex {
    display: flex;
    gap: 30px;
    align-items: center;
}

.album-art {
    width: 160px;
    height: 160px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 24px rgba(0,0,0,0.12);
    flex-shrink: 0;
}

.album-art img { width: 100%; height: 100%; object-fit: cover; }

.eyebrow { font-size: 10px; letter-spacing: 2px; font-weight: 700; color: var(--accent); text-transform: uppercase; }

.track-info h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    margin: 4px 0 0 0;
    color: var(--primary);
}

/* BARRA DE PROGRESO */
.progress-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
}

.time-label { font-size: 11px; font-weight: 600; color: #b0b0b0; width: 35px; }

.bar-bg {
    flex-grow: 1;
    height: 4px;
    background: #f0f0f0;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
}

#bar-fill {
    position: absolute;
    height: 100%;
    width: 0%;
    background: var(--primary);
    border-radius: 4px;
    transition: width 0.1s linear;
}

/* CONTROLES */
.playback-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-btns { display: flex; align-items: center; gap: 20px; }

.play-trigger {
    background: var(--primary);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.play-trigger:hover { transform: scale(1.1); box-shadow: 0 5px 15px rgba(27, 42, 86, 0.3); }

.icon-btn { background: none; border: none; font-size: 22px; color: #ced6e0; cursor: pointer; transition: 0.2s; }
.icon-btn:hover { color: var(--primary); }
.icon-btn.sm { font-size: 16px; color: #a4b0be; }

/* ÁREA DE LISTA Y LETRAS */
.playlist-container {
    border-top: 1px solid var(--border);
    margin-top: 10px;
}

.lyrics-drawer {
    background: #fcfcfc;
    border: 1px solid #f0f0f0;
    padding: 20px;
    border-radius: 16px;
    margin: 15px 0;
    max-height: 120px;
    overflow-y: auto;
    font-family: 'Inter', sans-serif;
    font-style: italic;
    color: var(--text-dark);
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
}

/* SCROLLBAR PARA LA LISTA */
.vertical-list {
    max-height: 400px;
    overflow-y: auto;
    padding-right: 5px;
}

.vertical-list::-webkit-scrollbar { width: 5px; }
.vertical-list::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }

.salmo-row {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    border-radius: 12px;
    margin-bottom: 5px;
    cursor: pointer;
    transition: 0.2s ease;
}

.salmo-row:hover:not(.disabled) { background: #f8faff; }
.salmo-row.active { background: #F4F7FF; }

.row-num {
    width: 35px;
    font-size: 14px;
    font-weight: 700;
    color: #cbd5e0;
}
.active .row-num { color: var(--primary); }

.row-info { flex-grow: 1; }
.row-info b { display: block; font-size: 15px; color: var(--primary); margin-bottom: 2px; }
.row-info span { font-size: 12px; color: var(--text-light); }

.row-dur { font-size: 12px; color: #a4b0be; font-weight: 600; }

.disabled { opacity: 0.5; cursor: default; }
.disabled b { color: #a4b0be; }

@media (max-width: 600px) {
    .player-flex { flex-direction: column; text-align: center; }
    .album-art { width: 180px; height: 180px; }
    .playback-controls { justify-content: center; gap: 30px; }
    .extra-controls { display: none; }
}
</style>

<script>
(function() {
    const playlist = [
        {
            name: "Salmo 5:1-2",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/5108a6fd3fb09f06ed3ab50b8edd56657ae7e87b/canciones/Salmo%205%201-2.mp3",
            lyrics: "Escucha, oh Jehová, mis palabras;<br>Considera mi gemir.<br>Está atento a la voz de mi clamor, Rey mío y Dios mío,<br>Porque a ti oraré.",
            dur: "2:30"
        },
        {
            name: "Salmo 5:3",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/5108a6fd3fb09f06ed3ab50b8edd56657ae7e87b/canciones/Salmo%205%203.mp3",
            lyrics: "Oh Jehová, de mañana oirás mi voz;<br>De mañana me presentaré delante de ti, y esperaré.",
            dur: "1:15"
        }
        // Agrega aquí más salmos reales cuando los tengas
    ];

    // Completar automáticamente hasta tener 24 espacios
    while(playlist.length < 24) {
        playlist.push({ 
            name: `Salmo ${playlist.length + 1} (Por definir)`, 
            url: "", 
            lyrics: "Próximamente disponible.", 
            dur: "--:--" 
        });
    }

    let currentIndex = -1;
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-toggle');
    const barFill = document.getElementById('bar-fill');
    const lyricsDiv = document.getElementById('display-lyrics');
    const titleDiv = document.getElementById('active-salmo-title');

    function init() {
        const listContainer = document.getElementById('list-salmos');
        listContainer.innerHTML = playlist.map((s, idx) => `
            <div class="salmo-row ${s.url ? '' : 'disabled'}" id="row-${idx}" onclick="selectTrack(${idx})">
                <div class="row-num">${(idx + 1).toString().padStart(2, '0')}</div>
                <div class="row-info">
                    <b>${s.name}</b>
                    <span>Colección de Salmos - IEPP</span>
                </div>
                <div class="row-dur">${s.dur}</div>
            </div>
        `).join('');
    }

    window.selectTrack = function(idx) {
        if(!playlist[idx].url) return;
        
        currentIndex = idx;
        const track = playlist[idx];
        
        audio.src = track.url;
        titleDiv.innerText = track.name;
        lyricsDiv.innerHTML = track.lyrics;
        
        document.querySelectorAll('.salmo-row').forEach(el => el.classList.remove('active'));
        document.getElementById(`row-${idx}`).classList.add('active');
        
        audio.play();
        updateUI(true);
    };

    window.handlePlay = function() {
        if(currentIndex === -1) { selectTrack(0); return; }
        if(audio.paused) { audio.play(); updateUI(true); } 
        else { audio.pause(); updateUI(false); }
    };

    window.changeSalmo = function(dir) {
        let newIdx = currentIndex + dir;
        if(newIdx < 0) newIdx = 23;
        if(newIdx > 23) newIdx = 0;
        
        if(playlist[newIdx].url) selectTrack(newIdx);
        else {
            // Si el siguiente no tiene audio, busca el que sigue (loop)
            currentIndex = newIdx; 
            changeSalmo(dir);
        }
    };

    window.toggleMute = function() {
        audio.muted = !audio.muted;
        document.getElementById('vol-icon').className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    };

    function updateUI(playing) {
        playBtn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
    }

    audio.ontimeupdate = () => {
        if(!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        barFill.style.width = pct + "%";
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-time').innerText = formatTime(audio.duration);
    };

    function formatTime(s) {
        let m = Math.floor(s/60); let sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('prog-bar-container').onclick = (e) => {
        if(!audio.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    audio.onended = () => changeSalmo(1);
    
    init();
})();
</script>
