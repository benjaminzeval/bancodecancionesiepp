<style>
/* --- OCULTAR SCROLL BAR GENERAL (Manteniendo scroll funcional) --- */

body::-webkit-scrollbar {

/* PALETA EXACTA DEL REPRODUCTOR (SEGÚN TU IMAGEN) */

.player-details { flex-grow: 1; }
.track-info h1 {

    font-weight: 700;
    font-style: normal;
    margin: 0; 
    color: var(--primary);
}
.sede-tag { color: var(--text-light); font-size: 14px; margin-top: 4px; }

/* BARRA PROGRESO */
.progress-wrapper { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
.time-label { font-size: 11px; font-weight: 600; color: #999; width: 35px; }
.bar-bg { flex-grow: 1; height: 5px; background: #eee; border-radius: 4px; cursor: pointer; position: relative; }
#bar-fill { position: absolute; height: 100%; width: 0%; background: var(--primary); border-radius: 4px; }

/* CONTROLES */
.playback-controls { display: flex; justify-content: space-between; align-items: center; }
.nav-btns { display: flex; align-items: center; gap: 14px; }
.play-trigger {
    background: var(--primary); color: white; width: 48px; height: 48px;

}

.icon-btn { background: none; border: none; font-size: 20px; color: var(--text-dark); cursor: pointer; transition: 0.2s; position: relative; }
.icon-btn.sm { font-size: 16px; color: #999; }
.icon-btn:hover { color: var(--primary); }

/* ESTADO ACTIVO PARA SHUFFLE Y LOOP */
.icon-btn.active {
    color: var(--primary);
}
.icon-btn.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: var(--primary);

}

/* ====================================================

.proj-overlay {

    // Quitar acentos/tildes para que la búsqueda sea infalible
    function normalizeText(text) {
        return (text || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }

    function renderList(term = '') {
        const listContainer = document.getElementById('list-salmos');
        const cleanTerm = normalizeText(term.trim());
        
        // Búsqueda inteligente en título y en toda la letra del salmo
        const filtered = playlist
            .map((s, idx) => ({ ...s, originalIdx: idx }))
            .filter(s => {
                const nameNorm = normalizeText(s.name);
                const lyricsNorm = normalizeText(s.lyrics);
                return nameNorm.includes(cleanTerm) || lyricsNorm.includes(cleanTerm);
            });

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div class="no-results">No se encontró ningún salmo ni letra con "${term}".</div>`;
            return;
        }

        listContainer.innerHTML = filtered.map(s => `
            <div class="salmo-row ${s.originalIdx === currentIndex ? 'active' : ''}" id="row-${s.originalIdx}" onclick="selectTrack(${s.originalIdx})">
                <div class="row-img">${s.originalIdx + 1}</div>
                <div class="row-info">
                    <b>${s.name}</b>
                    <span>IEPP Los Olivos</span>
                </div>
                <div class="row-duration">${s.dur}</div>
            </div>
        `).join('');
    }

        if(activeRow) {
            activeRow.classList.add('active');
            activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        audio.play();
        updateUI(true);
    };

    window.handlePlay = function() {
        if(currentIndex === -1) return selectTrack(0);
        if(audio.paused) { 
            audio.play(); 
            updateUI(true); 
        } else { 
            audio.pause(); 
            updateUI(false); 
        }
    };

    window.changeSalmo = function(dir) {
        if(isShuffle && playlist.length > 1) {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * playlist.length);
            } while (nextIndex === currentIndex);
            return selectTrack(nextIndex);
        }

        let n = currentIndex + dir;
        if(n < 0) n = playlist.length - 1;
        if(n >= playlist.length) n = 0;
        selectTrack(n);
    };

    window.toggleMute = function() {
        audio.muted = !audio.muted;
        document.getElementById('vol-icon').className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    };

    function updateUI(playing) {
        const iconHtml = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        playBtn.innerHTML = iconHtml;
        if(projPlayBtn) projPlayBtn.innerHTML = iconHtml;
        if(artOverlayIcon) {
            if(playing) artOverlayIcon.classList.add('show');
            else artOverlayIcon.classList.remove('show');
        }
    }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100;
        barFill.style.width = pct + "%";
        const cTime = formatTime(audio.currentTime);
        const tTime = formatTime(audio.duration || 0);

        document.getElementById('current-time').innerText = cTime;
        document.getElementById('total-time').innerText = tTime;

        if(projCurrTime) projCurrTime.innerText = cTime;
        if(projTotTime) projTotTime.innerText = tTime;
    };

    function formatTime(s) {
        let m = Math.floor(s/60); let sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('prog-bar-container').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    audio.onended = () => {
        if(isLoop) {
            audio.currentTime = 0;
            audio.play();
        } else {
            changeSalmo(1);
        }
    };

    /* ====================================================
       FUNCIONES DEL MODO PROYECCIÓN / PANTALLA COMPLETA
       ==================================================== */
    window.openProjection = function() {
        if(currentIndex === -1) {
            selectTrack(0);
        } else {
            const s = playlist[currentIndex];
            projTitle.innerText = s.name;
            projLyrics.innerHTML = s.lyrics || "";
        }
        projModal.style.display = 'flex';

        // Pantalla completa nativa del navegador si está soportada
        if (projModal.requestFullscreen) {
            projModal.requestFullscreen().catch(() => {});
        } else if (projModal.webkitRequestFullscreen) {
            projModal.webkitRequestFullscreen();
        }
    };

    window.closeProjection = function() {
        projModal.style.display = 'none';
        if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
    };

    window.changeProjFontSize = function(delta) {
        projFontSize += delta;
        if(projFontSize < 18) projFontSize = 18;
        if(projFontSize > 54) projFontSize = 54;
        projLyrics.style.fontSize = projFontSize + 'px';
    };

    // Alternar Negrita en proyección
    window.toggleProjBold = function() {
        isProjBold = !isProjBold;
        if(projLyrics) {
            projLyrics.classList.toggle('bold-text', isProjBold);
        }
        if(projBoldBtn) {
            projBoldBtn.classList.toggle('active', isProjBold);
        }
    };

    // Alternar entre Modo Día y Modo Noche en proyección
    window.toggleProjTheme = function() {
        if(projModal.classList.contains('theme-day')) {
            projModal.classList.remove('theme-day');
            projModal.classList.add('theme-night');
            projThemeIcon.className = 'fa-solid fa-sun';
        } else {
            projModal.classList.remove('theme-night');
            projModal.classList.add('theme-day');
            projThemeIcon.className = 'fa-solid fa-moon';
        }
    };

    // Ocultar / Mostrar barra superior de proyección
    window.toggleProjHeader = function() {
        isHeaderHidden = !isHeaderHidden;
        if(isHeaderHidden) {
            projHeaderBar.style.display = 'none';
            projRestoreBtn.style.display = 'flex';
        } else {
            projHeaderBar.style.display = 'flex';
            projRestoreBtn.style.display = 'none';
        }
    };

    // Atajos de teclado en proyección:
    // - Tecla Escape: Salir de proyección
    // - Tecla H: Ocultar o mostrar barra superior
    // - Tecla B: Alternar Negrita
    document.addEventListener('keydown', (e) => {
        if (projModal.style.display === 'flex') {
            if (e.key === 'Escape') {
                closeProjection();
            } else if (e.key === 'h' || e.key === 'H') {
                toggleProjHeader();
            } else if (e.key === 'b' || e.key === 'B') {
                toggleProjBold();
            }
        }
    });

    renderList();
})();
</script>
