<!-- Fuentes e Iconos Modernos -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div id="salmos-widget-container">
    
    <!-- TARJETA PRINCIPAL DEL REPRODUCTOR -->
    <div class="main-player-card">
        <div class="player-header">
            <span class="eyebrow">IGLESIA EVANGÉLICA PRESBITERIANA DEL PERÚ</span>
            <h1 id="active-salmo-title">Colección de Salmos</h1>
            <p class="sede-tag">IEPP Los Olivos</p>
        </div>

        <div class="lyrics-container">
            <div id="display-lyrics" class="lyrics-text">
                <div class="empty-state">
                    <i class="fa-solid fa-headphones-simple"></i>
                    <p>Selecciona un salmo para comenzar</p>
                </div>
            </div>
        </div>

        <div class="audio-interface">
            <audio id="main-audio"></audio>
            
            <div class="progress-area" id="prog-bar-container">
                <div class="time-label" id="current-time">0:00</div>
                <div class="bar-bg">
                    <div id="bar-fill"></div>
                </div>
                <div class="time-label" id="total-time">0:00</div>
            </div>

            <div class="controls-main">
                <button class="vol-btn" onclick="toggleMute()"><i id="vol-icon" class="fa-solid fa-volume-high"></i></button>
                
                <div class="playback-btns">
                    <button class="step-btn" onclick="changeSalmo(-1)"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="play-toggle" class="play-main-btn" onclick="handlePlay()">
                        <i class="fa-solid fa-play"></i> <span>REPRODUCIR</span>
                    </button>
                    <button class="step-btn" onclick="changeSalmo(1)"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                
                <div class="spacer-div"></div>
            </div>
        </div>
    </div>

    <!-- LISTA DE CANCIONES (WIDGET STYLE) -->
    <div class="playlist-section">
        <h3 class="section-label">Explorar Colección</h3>
        <div id="grid-salmos" class="playlist-grid">
            <!-- Items generados dinámicamente -->
        </div>
    </div>

</div>

<style>
/* VARIABLES ELFSIGHT STYLE */
#salmos-widget-container {
    --primary: #1B2A56;
    --accent: #B5967B;
    --bg-card: #ffffff;
    --bg-page: transparent;
    --text-dark: #2D3436;
    --text-light: #636E72;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0,0,0,0.08);
    
    max-width: 100%;
    margin: 0 auto;
    font-family: 'Inter', sans-serif;
    color: var(--text-dark);
}

/* ELIMINAR SCROLLS DOBLES */
#salmos-widget-container * { box-sizing: border-box; }

.main-player-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.05);
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
}

/* EFECTO DE LÍNEA SUPERIOR */
.main-player-card::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--primary);
}

.eyebrow { font-size: 11px; letter-spacing: 2.5px; font-weight: 700; color: var(--accent); display: block; margin-bottom: 8px; }

h1#active-salmo-title { 
    font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0; color: var(--primary); font-style: italic; 
}

.sede-tag { font-size: 14px; color: var(--text-light); margin: 4px 0 0; opacity: 0.8; }

/* AREA DE LETRAS DINÁMICA SIN OVERFLOW MONTADO */
.lyrics-container {
    margin: 25px 0;
    min-height: 120px;
    max-height: 250px;
    overflow-y: auto;
    padding-right: 10px;
    font-size: 1.1rem;
    line-height: 1.8;
    font-style: italic;
    color: #444;
}
/* Scrollbar estético */
.lyrics-container::-webkit-scrollbar { width: 4px; }
.lyrics-container::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }

.empty-state { text-align: center; color: #ddd; padding: 20px; }
.empty-state i { font-size: 2.5rem; margin-bottom: 10px; }

/* CONTROLES DE AUDIO */
.progress-area { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.time-label { font-size: 11px; font-weight: 600; color: var(--text-light); width: 35px; }
.bar-bg { flex: 1; height: 5px; background: #F1F2F6; border-radius: 10px; cursor: pointer; position: relative; }
#bar-fill { position: absolute; height: 100%; width: 0%; background: var(--accent); border-radius: 10px; transition: width 0.1s linear; }

.controls-main { display: flex; align-items: center; justify-content: space-between; }
.vol-btn { background: none; border: none; font-size: 18px; color: var(--text-light); cursor: pointer; padding: 10px; }

.playback-btns { display: flex; align-items: center; gap: 20px; }
.step-btn { background: none; border: none; font-size: 1.5rem; color: #ced6e0; cursor: pointer; transition: 0.3s; }
.step-btn:hover { color: var(--primary); }

.play-main-btn {
    background: var(--primary); color: white; border: none; border-radius: 50px;
    padding: 12px 35px; font-weight: 700; letter-spacing: 1px; font-size: 13px;
    cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.play-main-btn:hover { transform: scale(1.05); background: #263b77; }
.spacer-div { width: 40px; }

/* PLAYLIST GRID - TIPO WIDGET */
.section-label { font-size: 1.2rem; color: var(--primary); margin-bottom: 15px; font-family: 'Playfair Display', serif; }
.playlist-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    gap: 12px; 
}

.salmo-item {
    background: #fff; border: 1px solid rgba(0,0,0,0.06); padding: 16px; 
    border-radius: 12px; cursor: pointer; transition: all 0.25s ease;
    display: flex; align-items: center; gap: 12px;
}
.salmo-item:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
.salmo-item.active { border-color: var(--primary); background: #F8FAFF; }

.num-circle { 
    width: 32px; height: 32px; background: #f1f2f6; border-radius: 50%; 
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--accent); transition: 0.3s;
}
.active .num-circle { background: var(--primary); color: white; }

.item-info b { display: block; font-size: 14px; color: var(--primary); }
.item-info span { font-size: 11px; color: var(--text-light); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

.disabled { opacity: 0.4; cursor: default; filter: grayscale(1); }

/* RESPONSIVE FIXES */
@media (max-width: 600px) {
    .main-player-card { padding: 20px; }
    h1#active-salmo-title { font-size: 1.6rem; }
    .controls-main { flex-direction: column; gap: 20px; }
    .spacer-div { display: none; }
    .playlist-grid { grid-template-columns: 1fr; }
}
</style>

<script>
(function() {
    const playlist = [
        {
            name: "Salmo 5:1-2",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/5108a6fd3fb09f06ed3ab50b8edd56657ae7e87b/canciones/Salmo%205%201-2.mp3",
            lyrics: "Escucha, oh Jehová, mis palabras;<br>Considera mi gemir.<br>Está atento a la voz de mi clamor, Rey mío y Dios mío,<br>Porque a ti oraré."
        },
        {
            name: "Salmo 5:3",
            url: "https://raw.githubusercontent.com/benjaminzeval/bancodecancionesiepp/5108a6fd3fb09f06ed3ab50b8edd56657ae7e87b/canciones/Salmo%205%203.mp3",
            lyrics: "Oh Jehová, de mañana oirás mi voz;<br>De mañana me presentaré delante de ti, y esperaré."
        }
    ];

    // Llenar slots hasta completar 24 si faltan
    while(playlist.length < 24) {
        playlist.push({ name: `Salmo por Definir ${playlist.length + 1}`, url: "", lyrics: "Disponible próximamente." });
    }

    let currentIndex = -1;
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-toggle');
    const lyricsDiv = document.getElementById('display-lyrics');
    const titleDiv = document.getElementById('active-salmo-title');
    const barFill = document.getElementById('bar-fill');

    function init() {
        const grid = document.getElementById('grid-salmos');
        grid.innerHTML = playlist.map((s, idx) => `
            <div class="salmo-item ${s.url ? '' : 'disabled'}" id="item-${idx}" onclick="selectTrack(${idx})">
                <div class="num-circle">${idx + 1}</div>
                <div class="item-info">
                    <span>${s.url ? 'Salmo Cantado' : 'Próximamente'}</span>
                    <b>${s.name}</b>
                </div>
            </div>
        `).join('');
    }

    window.selectTrack = function(idx) {
        const track = playlist[idx];
        if(!track.url) return;

        currentIndex = idx;
        audio.src = track.url;
        titleDiv.innerText = track.name;
        lyricsDiv.innerHTML = track.lyrics;

        document.querySelectorAll('.salmo-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`item-${idx}`).classList.add('active');

        audio.play();
        updateUI(true);
    };

    window.handlePlay = function() {
        if(currentIndex === -1) { selectTrack(0); return; }
        if(audio.paused) { audio.play(); updateUI(true); } 
        else { audio.pause(); updateUI(false); }
    };

    window.changeSalmo = function(step) {
        let newIdx = currentIndex + step;
        if(newIdx < 0) newIdx = playlist.length -1;
        if(newIdx >= playlist.length) newIdx = 0;
        
        if(playlist[newIdx].url) selectTrack(newIdx);
        else changeSalmo(step); // buscar el siguiente con audio
    };

    window.toggleMute = function() {
        audio.muted = !audio.muted;
        document.getElementById('vol-icon').className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    };

    function updateUI(playing) {
        playBtn.innerHTML = playing ? `<i class="fa-solid fa-pause"></i> <span>PAUSAR</span>` : `<i class="fa-solid fa-play"></i> <span>REPRODUCIR</span>`;
    }

    // Handlers de progreso
    audio.ontimeupdate = () => {
        if(!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        barFill.style.width = pct + "%";
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-time').innerText = formatTime(audio.duration);
    };

    function formatTime(s) {
        let m = Math.floor(s/60); let sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0'+sc : sc}`;
    }

    document.getElementById('prog-bar-container').onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    audio.onended = () => changeSalmo(1);

    setTimeout(init, 50);
})();
</script>
